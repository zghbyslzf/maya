[tasks.fmt-check]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]
workspace = false
cwd = "."

[tasks.clippy]
clear = true
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
workspace = false
cwd = "."

[tasks.test]
clear = true
command = "cargo"
args = ["test", "--workspace"]
workspace = false
cwd = "."

[tasks.release-build]
command = "cargo"
args = ["build", "--release", "--locked"]
workspace = false
cwd = "."

[tasks.release-config-check]
command = "powershell"
args = [
  "-NoLogo",
  "-NoProfile",
  "-NonInteractive",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "scripts/verify-release-config.ps1",
]
workspace = false
cwd = "."

[tasks.verify]
dependencies = ["fmt-check", "clippy", "test", "release-build", "release-config-check"]
workspace = false
cwd = "."

# 保留原有 build 入口，但普通构建不再修改版本或组装发布包。
[tasks.build]
clear = true
dependencies = ["release-build"]
workspace = false
cwd = "."

[tasks.sync-package-version]
dependencies = ["verify"]
command = "powershell"
args = [
  "-NoLogo",
  "-NoProfile",
  "-NonInteractive",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "scripts/sync-package-version.ps1",
]
workspace = false
cwd = "."

[tasks.assemble-package]
dependencies = ["sync-package-version"]
command = "powershell"
args = [
  "-NoLogo",
  "-NoProfile",
  "-NonInteractive",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "scripts/assemble-package.ps1",
]
workspace = false
cwd = "."

[tasks.package-smoke-test]
dependencies = ["assemble-package"]
command = "powershell"
args = [
  "-NoLogo",
  "-NoProfile",
  "-NonInteractive",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "scripts/package-smoke-test.ps1",
]
workspace = false
cwd = "."

[tasks.package]
clear = true
dependencies = ["package-smoke-test"]
workspace = false
cwd = "."

# 发布始终是显式任务，不会被 build、verify 或 package 隐式触发。
[tasks.npm-publish]
dependencies = ["package"]
command = "npm.cmd"
args = ["publish", "--registry=https://registry.npmjs.org"]
workspace = false
cwd = "pkg"

[tasks.publish]
clear = true
dependencies = ["npm-publish"]
workspace = false
cwd = "."

[tasks.publish-all]
dependencies = ["publish"]
workspace = false
cwd = "."
