[workspace]
members = [
    "crates/maya-core",
    "crates/maya-fs",
    "crates/maya-git",
    "crates/maya-media",
]
resolver = "2"

[package]
name = "maya"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Windows 平台的项目清理、归档、图片优化和视频转换 CLI"

[workspace.package]
version = "0.1.55"
edition = "2021"
license = "MIT"
repository = "https://github.com/zghbyslzf/maya"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true          # Enable Link Time Optimization.
codegen-units = 1   # Maximize optimizations opportunities.
panic = 'abort'     # Abort on panic.
strip = true        # Strip symbols from binary (requires cargo 1.59+).

[workspace.dependencies]
maya-core = { path = "crates/maya-core" }
maya-fs = { path = "crates/maya-fs" }
maya-git = { path = "crates/maya-git" }
maya-media = { path = "crates/maya-media" }

# 共享依赖，可以被多个crate使用
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
zip = "2.6.1"
regex = "1.11"
ignore = "0.4.22"
tokio = { version = "1.0", features = ["process", "rt-multi-thread", "macros"] }
thiserror = "1.0"
rayon = "1.10"
tempfile = "3.19"
sha2 = "0.10"

[dependencies]
clap = { workspace = true }
maya-core = { workspace = true }
maya-fs = { workspace = true }
maya-git = { workspace = true }
maya-media = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = { workspace = true }
image = "0.25.6"
