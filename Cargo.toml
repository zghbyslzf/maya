[workspace]
# 指定工作区成员的路径，这里是"./crates/*"，意味着包含crates目录下的所有包。
members = [
    "crates/maya-core",
    "crates/maya-fs",
    "crates/maya-git",
    "crates/maya-media",
]
# 指定使用的依赖解析器版本，这里是"2"
resolver = "2"

[package]
name = "maya"
version = "0.1.55"
edition = "2021"

[workspace.package]
# 指定Rust版本，这里是"2021"
edition    = "2021"
# 开源许可证
license    = "MIT"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true          # Enable Link Time Optimization.
codegen-units = 1   # Maximize optimizations opportunities.
panic = 'abort'     # Abort on panic.
strip = true        # Strip symbols from binary (requires cargo 1.59+).

[workspace.dependencies]
maya-core = { version = "0.1.0", path = "crates/maya-core" }
maya-fs = { version = "0.1.0", path = "crates/maya-fs" }
maya-git = { version = "0.1.0", path = "crates/maya-git" }
maya-media = { version = "0.1.0", path = "crates/maya-media" }

# 共享依赖，可以被多个crate使用
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
zip = "2.6.1"
regex = "1.11"
ignore = "0.4.22"
tokio = { version = "1.0", features = ["process", "rt-multi-thread", "macros"] }
thiserror = "1.0"
rayon = "1.10"
tempfile = "3.19"

[dependencies]
clap = { workspace = true }
maya-core = { workspace = true }
maya-fs = { workspace = true }
maya-git = { workspace = true }
maya-media = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = { workspace = true }
image = "0.25.6"
